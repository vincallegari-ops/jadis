<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Jadis</title>
<meta name="description" content="Des histoires vraies et surprenantes, de toutes les époques. Hors connexion.">
<meta name="theme-color" content="#15130F">

<style>
/* Concept : une appli de lecture en papier déchiré. Chaque époque colore tout l'écran ; le papier crème porte le texte. */
:root{
  --night:#15130F; --ink:#15130F; --paper:#F6F2E6; --paper2:#FBF8EE; --sand:#E4DDC6;
  --muted:#B9B3A3; --soft:#D8D3C4; --white:#FFFFFF; --ring:#FFFFFF; --band:#15130F;
  --ui:'Bricolage Grotesque',system-ui,sans-serif; --serif:'Literata',Georgia,serif; --logo:'Fraunces',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button{font:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--night)}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.enter{animation:rise 260ms cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.enter{animation:fade 150ms ease both}}
.opt{transition:transform 160ms cubic-bezier(.23,1,.32,1),filter 160ms ease;cursor:pointer}
.opt:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.opt:hover{filter:brightness(1.04)}}
button:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.optwrap button:focus-visible{outline:none}
.optwrap:has(button:focus-visible){outline:3px solid var(--ring);outline-offset:3px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.bar button{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar button:focus-visible{outline-color:var(--ink)}
.bar .logo{font-family:var(--logo);font-weight:900;font-size:28px;letter-spacing:-.02em;color:var(--ink)}
.col{hyphens:auto;-webkit-hyphens:auto;text-align:justify;margin:0;font-family:var(--serif);font-size:17px;line-height:1.6}
.pill{min-height:44px;padding:0 16px;border-radius:22px;background:transparent;display:inline-flex;align-items:center;gap:8px;font-family:var(--ui);font-size:14px;font-weight:600;cursor:pointer}
h1,h2{text-wrap:balance}
.state{font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--muted)}
.splash{position:fixed;inset:0;background:var(--night);overflow:hidden;z-index:50;cursor:pointer}
.splash-inner{position:relative;max-width:480px;margin:0 auto;height:100%}
.splash-card-text{transition:opacity 200ms cubic-bezier(.23,1,.32,1)}
.transition-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:60;text-align:center;padding:0 24px;animation:fade 1000ms cubic-bezier(.23,1,.32,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hook-stagger .optwrap{opacity:0;animation:cardIn 320ms cubic-bezier(.23,1,.32,1) both}
.hook-stagger .optwrap:nth-child(1){animation-delay:0ms}
.hook-stagger .optwrap:nth-child(2){animation-delay:60ms}
.hook-stagger .optwrap:nth-child(3){animation-delay:120ms}
@media (prefers-reduced-motion:reduce){.hook-stagger .optwrap{animation:none;opacity:1}}
.loading-fade{animation:fade 300ms ease both}
.transition-date{font-family:var(--logo);font-weight:900;font-size:76px;line-height:1;letter-spacing:-.01em}
.transition-place{font-size:26px}
</style>
<div id="app"></div>

<script>
(function () {
'use strict';
var ARTICLES = [];
var BY_ID = {};
function indexArticles() {
  BY_ID = {};
  ARTICLES.forEach(function (a) { BY_ID[a.id] = a; });
}

var INK = '#15130F', PAPER = '#F6F2E6';
var ERAS = {
  'Antiquité':       { bg:'#2A5D9F', fg:'#FFFFFF', tx:'#2A5D9F', font:"'Marcellus', Georgia, serif", dw:400, ts:28, tl:1.18, tw:400, dcase:'uppercase', dls:'0.12em', dsz:20, ring:'#FFFFFF' },
  'Moyen Âge':       { bg:'#C23A22', fg:'#FFFFFF', tx:'#B5331C', font:"'Grenze Gotisch', Georgia, serif", dw:800, ts:33, tl:1.08, tw:700, dcase:'none', dls:'0', dsz:31, ring:'#FFFFFF' },
  'Renaissance':     { bg:'#1F7A6E', fg:'#FFFFFF', tx:'#1B6F64', font:"'Cormorant Garamond', Georgia, serif", dw:700, ts:35, tl:1.06, tw:700, dcase:'none', dls:'0.02em', dsz:31, ring:'#FFFFFF' },
  'Révolutions':     { bg:'#A3214B', fg:'#FFFFFF', tx:'#A3214B', font:"'Libre Baskerville', Georgia, serif", dw:700, ts:24, tl:1.25, tw:700, dcase:'uppercase', dls:'0.06em', dsz:18, ring:'#FFFFFF' },
  'Ère industrielle':{ bg:'#E3B505', fg:'#15130F', tx:'#7E6100', font:"'Alfa Slab One', Georgia, serif", dw:400, ts:25, tl:1.16, tw:400, dcase:'uppercase', dls:'0.05em', dsz:18, ring:'#15130F' }
};
var ERA_ORDER = ['Antiquité', 'Moyen Âge', 'Renaissance', 'Révolutions', 'Ère industrielle'];
var STRATA_TOP = [0, 54, 108, 260, 180];
var STRATA_BH = 150;
var STRATA_TOTAL = 412;

/* ---------- état persistant (par lecteur, sur cet appareil) ---------- */
var KEY = 'jadis.v1';
var store = { read: [], saved: [] };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) { var p = JSON.parse(raw); if (p && Array.isArray(p.read) && Array.isArray(p.saved)) store = p; }
} catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function isRead(id) { return store.read.indexOf(id) >= 0; }
function isSaved(id) { return store.saved.indexOf(id) >= 0; }
function markRead(id) { if (!isRead(id)) { store.read.push(id); persist(); } }
function toggleSaved(id) {
  var i = store.saved.indexOf(id);
  if (i >= 0) store.saved.splice(i, 1); else store.saved.push(id);
  persist();
}

var view = { name: 'home', id: null, revealed: false };
var speechState = { playing: false, articleId: null };
function stopSpeech() {
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  speechState.playing = false;
  speechState.articleId = null;
}
function toggleSpeech(a) {
  if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
  if (speechState.playing && speechState.articleId === a.id) {
    stopSpeech();
    render(false);
    return;
  }
  stopSpeech();
  var text = a.titre + '. ' + a.paragraphes.join(' ') + ' ' + a.anecdote;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.98;
  u.onend = function () { if (speechState.articleId === a.id) { speechState.playing = false; speechState.articleId = null; render(false); } };
  u.onerror = function () { if (speechState.articleId === a.id) { speechState.playing = false; speechState.articleId = null; render(false); } };
  speechState.playing = true;
  speechState.articleId = a.id;
  window.speechSynthesis.speak(u);
  render(false);
}

/* ---------- utilitaires ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function dateText(a) {
  if (a.date.post === 'av. J.-C.') { return '-' + a.date.big; }
  return [a.date.pre, a.date.big, a.date.post].filter(Boolean).join(' ');
}
function hash(str) { var h = 7; for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 233280; return h || 1; }
function rng(seed) { var v = seed; return function () { v = (v * 9301 + 49297) % 233280; return v / 233280; }; }
function torn(seed, steps, amp) {
  var r = rng(seed), pts = [], i;
  for (i = 0; i <= steps; i++) pts.push((i / steps * 100).toFixed(1) + '% ' + (r() * amp).toFixed(1) + 'px');
  for (i = steps; i >= 0; i--) pts.push((i / steps * 100).toFixed(1) + '% calc(100% - ' + (r() * amp).toFixed(1) + 'px)');
  return 'polygon(' + pts.join(', ') + ')';
}

/* ---------- choix de la suite (jamais un article déjà lu) ---------- */
function visitCount(field, value) {
  return store.read.filter(function (id) { return BY_ID[id] && BY_ID[id][field] === value; }).length;
}
function unreadPool(currentId) {
  return ARTICLES.filter(function (a) { return !isRead(a.id) && a.id !== currentId; });
}
function scoreOf(a, cur) {
  var s = visitCount('continent', a.continent) + visitCount('epoque', a.epoque);
  if (cur && a.continent === cur.continent) s += 2;
  if (cur && a.epoque === cur.epoque) s += 1;
  return s + Math.random() * 1.5;
}
function pickN(currentId, n) {
  var cur = currentId ? BY_ID[currentId] : null;
  var pool = unreadPool(currentId).map(function (a) { return { a: a, s: scoreOf(a, cur) }; })
    .sort(function (x, y) { return x.s - y.s; }).map(function (x) { return x.a; });
  if (pool.length <= n) return pool;
  var chosen = [pool[0]], rest = pool.slice(1);
  while (chosen.length < n && rest.length) {
    var pick = rest.filter(function (a) { return chosen.every(function (c) { return a.continent !== c.continent && a.epoque !== c.epoque; }); })[0]
      || rest.filter(function (a) { return chosen.every(function (c) { return a.continent !== c.continent; }); })[0]
      || rest[0];
    chosen.push(pick);
    rest = rest.filter(function (a) { return a !== pick; });
  }
  return chosen;
}

/* ---------- morceaux d'interface ---------- */
var ICON_HOME = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 10.5L11 3l8 7.5V19H13v-5H9v5H3z" fill="none" stroke="#15130F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
function iconBookmark(fill, ink) {
  return '<svg width="18" height="22" viewBox="0 0 16 20" aria-hidden="true"><path d="M2 1.5h12v17l-6-4.2-6 4.2z" fill="' + fill + '" stroke="' + ink + '" stroke-width="2" stroke-linejoin="round"/></svg>';
}
function surpriseHookCardHTML(excludeIds) {
  var pool = unreadPool(null).filter(function (a) { return excludeIds.indexOf(a.id) < 0; });
  if (!pool.length) return '';
  var style = 'width:100%;text-align:center;border:0;background:' + PAPER + ';color:' + INK + ';padding:38px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;clip-path:' + torn(hash('surprise-home'), 24, 7);
  return '<div class="optwrap" style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><button type="button" class="opt" data-hook-surprise="' + esc(excludeIds.join(',')) + '" style="' + style + '">' +
    '<span style="font-family:var(--logo);font-weight:900;font-size:30px" aria-hidden="true">?</span>' +
    '<span style="font:700 14px var(--ui);text-transform:uppercase;letter-spacing:.08em">Surprise</span>' +
    '</button></div>';
}
function surprisePick(currentId, excludeIds) {
  var pool = unreadPool(currentId).filter(function (a) { return !excludeIds || excludeIds.indexOf(a.id) < 0; });
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
function hookCardHTML(a, salt) {
  var e = ERAS[a.epoque];
  var style = 'width:100%;text-align:center;border:0;background:' + e.bg + ';color:' + e.fg + ';padding:38px 22px;display:flex;align-items:center;justify-content:center;min-height:118px;clip-path:' + torn(hash(a.id) + salt, 24, 7);
  return '<div class="optwrap" style="filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><button type="button" class="opt" data-hook="' + a.id + '" style="' + style + '">' +
    '<span style="font-family:' + e.font + ';font-weight:' + e.tw + ';font-size:' + Math.round(e.ts * 0.78) + 'px;line-height:1.15;text-transform:' + e.dcase + ';letter-spacing:' + e.dls + '">' + esc(a.hook || a.titre) + '</span>' +
    '</button></div>';
}
function savedRowHTML(a, withRemove) {
  var e = ERAS[a.epoque];
  var rowStyle = 'width:100%;text-align:left;border:0;background:' + PAPER + ';padding:0;display:flex;align-items:stretch;clip-path:' + torn(hash(a.id) + 5, 20, 4);
  var main = '<div class="optwrap" style="flex:1;min-width:0;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))"><button type="button" class="opt" data-go="' + a.id + '" style="' + rowStyle + '">' +
    '<span style="flex:none;width:10px;background:' + e.bg + '"></span>' +
    '<span style="display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px;min-width:0">' +
    '<span style="font:600 12px var(--ui);color:#4A473F">' + esc(a.lieu) + ' · ' + esc(dateText(a)) + (isRead(a.id) ? ' · lue' : '') + '</span>' +
    '<span style="font-family:' + e.font + ';font-weight:' + e.tw + ';font-size:20px;line-height:1.15;color:' + INK + '">' + esc(a.titre) + '</span>' +
    '</span></button></div>';
  if (!withRemove) return main;
  return '<div style="display:flex;align-items:center;gap:8px">' + main +
    '<button type="button" class="opt" data-unsave="' + a.id + '" aria-label="Retirer « ' + esc(a.titre) + ' » de la bibliothèque" style="flex:none;width:44px;height:44px;border:2px solid #8A8472;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center">' +
    '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="#D8D3C4" stroke-width="2" stroke-linecap="round"/></svg></button></div>';
}
function savedList() { return store.saved.map(function (id) { return BY_ID[id]; }).filter(Boolean); }

/* ---------- écrans ---------- */
function homeNoteCardHTML() {
  return '<div style="position:absolute;left:-8px;right:-8px;top:120px;transform:rotate(-2deg);filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))">' +
    '<div style="background:' + PAPER + ';padding:26px 24px 30px;text-align:center;clip-path:' + torn(91, 34, 9) + '">' +
    '<div style="font-family:var(--logo);font-weight:900;font-size:84px;line-height:.95;letter-spacing:-.02em;color:' + INK + '">Jadis</div>' +
    '<div style="font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.4;margin-top:8px;color:#3A372E">Des histoires pour les curieux d’Histoire.</div>' +
    '</div></div>';
}
function homeBodyHTML() {
  var saved = savedList();
  var out = '<div class="gx" style="padding-top:36px;padding-bottom:44px;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center">';
  out += '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">' +
    '<button type="button" class="pill opt" data-library="1" style="border:2px solid #fff;color:#fff">Bibliothèque' + (saved.length ? ' (' + saved.length + ')' : '') + '</button>' +
    '</div>';
  if (!view.revealed) {
    out += '<div style="display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:6px">' +
      '<p style="margin:0;max-width:300px;font:16px/1.5 var(--serif);font-style:italic;color:var(--soft)">Trois indices vous attendent. Une seule Histoire derrière chacun.</p>' +
      '<button type="button" class="pill opt" data-start-explore="1" style="border:0;background:#fff;color:var(--ink);font-weight:800;padding:0 26px;min-height:50px">Commencez l’exploration</button>' +
      '</div>';
  } else {
    var opts = pickN(null, 2);
    if (opts.length) {
      var exclIds = opts.map(function (a) { return a.id; });
      out += '<div class="hook-stagger" style="display:flex;flex-direction:column;gap:14px;width:100%;margin-top:6px">' +
        '<p style="margin:0;font:600 13px var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Lequel vous intrigue ?</p>' +
        opts.map(function (a, i) { return hookCardHTML(a, 3 + i * 7); }).join('') + surpriseHookCardHTML(exclIds) + '</div>';
    } else {
      out += '<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><p style="margin:0;font:16px/1.5 var(--serif);color:var(--soft)">Les ' + ARTICLES.length + ' escales disponibles sont derrière vous.</p>' +
        '<button type="button" class="pill opt" data-reset="1" style="border:2px solid #fff;color:#fff">Recommencer le voyage</button></div>';
    }
  }
  out += '</div>';
  return out;
}
function homeHTML() {
  var strata = ERA_ORDER.map(function (n, i) {
    return '<div style="position:absolute;left:-6px;right:-6px;top:' + STRATA_TOP[i] + 'px;height:' + STRATA_BH + 'px;background:' + ERAS[n].bg + ';clip-path:' + torn(70 + i * 13, 26, 10) + '"></div>';
  }).join('');
  var out = '<div style="position:relative;height:' + STRATA_TOTAL + 'px;overflow:hidden">' + strata + homeNoteCardHTML() + '</div>';
  return out + homeBodyHTML();
}

function libraryHTML() {
  var saved = savedList().slice().reverse();
  var out = '<div class="gx" style="padding-top:20px;padding-bottom:44px;display:flex;flex-direction:column;gap:14px">' +
    '<button type="button" class="opt" data-home="1" aria-label="Retour à l’accueil" style="align-self:flex-start;width:44px;height:44px;border:2px solid #fff;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center">' + ICON_HOME.replace('#15130F', '#FFFFFF') + '</button>' +
    '<h1 style="margin:8px 0 0;font:900 38px/1.05 var(--logo);color:#fff">Bibliothèque</h1>' +
    '<p style="margin:0;font:16px/1.5 var(--serif);color:var(--soft)">' + (saved.length === 0 ? 'Aucune histoire gardée' : saved.length + (saved.length > 1 ? ' histoires gardées' : ' histoire gardée')) + '</p>';
  out += saved.map(function (a) { return savedRowHTML(a, true); }).join('');
  if (!saved.length) out += '<p class="state">Rien ici pour l’instant. Touchez le marque-page d’une histoire pour la retrouver ici.</p>';
  return out + '</div>';
}

function storyHTML(a) {
  var e = ERAS[a.epoque], seed = hash(a.id);
  var saved = isSaved(a.id);
  var speechSupported = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  var speaking = speechState.playing && speechState.articleId === a.id;
  var bar = '<div class="bar gx" style="padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))">' +
    '<button type="button" class="opt" data-home="1" aria-label="Retour à l’accueil" style="justify-self:start">' + ICON_HOME + '</button>' +
    '<span class="logo">Jadis</span>' +
    '<button type="button" class="opt" data-save="' + a.id + '" aria-pressed="' + saved + '" aria-label="' + (saved ? 'Retirer de la bibliothèque' : 'Garder dans la bibliothèque') + '" style="justify-self:end">' + iconBookmark(saved ? INK : 'none', INK) + '</button></div>';
  var paras = a.paragraphes.map(function (t, i) {
    if (i === 0) return '<p class="col" lang="fr"><span style="float:left;font-family:' + e.font + ';font-weight:' + e.dw + ';font-size:58px;line-height:.78;padding:6px 8px 0 0;color:' + e.tx + '">' + esc(t.charAt(0)) + '</span>' + esc(t.slice(1)) + '</p>';
    return '<p class="col" lang="fr">' + esc(t) + '</p>';
  }).join('');
  if (!view.next) view.next = pickN(a.id, 2).map(function (x) { return x.id; });
  var next = view.next.map(function (id) { return BY_ID[id]; });
  var field = 'background-color:' + e.bg + ';background-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,.38) 100%);padding-top:22px;padding-bottom:44px;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 56px)';
  var dl = 'font-family:' + e.font + ';font-weight:' + e.tw + ';font-size:' + e.dsz + 'px;line-height:1.2;text-transform:' + e.dcase + ';letter-spacing:' + e.dls + ';color:' + e.fg;
  var out = bar + '<div class="gx" style="' + field + '">' +
    '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;margin-bottom:-6px;color:' + e.fg + '"><span style="' + dl + '">' + esc(a.lieu) + '</span><span style="' + dl + '">' + esc(dateText(a)) + '</span></div>' +
    '<div style="margin:0 -8px;transform:rotate(-1.2deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))"><div style="background:' + PAPER + ';padding:22px 18px 24px;clip-path:' + torn(seed, 30, 9) + '">' +
    '<h1 style="margin:0;color:' + INK + ';font-family:' + e.font + ';font-size:' + e.ts + 'px;line-height:' + e.tl + ';font-weight:' + e.tw + '">' + esc(a.titre) + '</h1></div></div>' +
    '<div style="margin:6px 0 0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><div style="background:' + PAPER + ';padding:28px 20px 30px;display:flex;flex-direction:column;gap:14px;clip-path:' + torn(seed + 11, 28, 8) + '">' + paras + '</div></div>' +
    '<div style="margin:0 2px 0 24px;transform:rotate(1.2deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><div style="background:var(--paper2);padding:24px 18px 26px;display:flex;flex-direction:column;gap:8px;clip-path:' + torn(seed + 23, 20, 7) + '">' +
    '<span style="font-family:' + e.font + ';font-size:22px;line-height:1.1;font-weight:' + e.tw + ';color:' + INK + '">L’anecdote</span>' +
    '<p style="margin:0;font:italic 17px/1.55 var(--serif);color:' + INK + '">' + esc(a.anecdote) + '</p></div></div>' +
    '<div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap">' +
    '<button type="button" class="pill opt" data-save="' + a.id + '" aria-pressed="' + saved + '" style="border:2px solid ' + e.fg + ';color:' + e.fg + '">' + iconBookmark(saved ? e.fg : 'none', e.fg) + '<span>' + (saved ? 'Gardée' : 'Garder') + '</span></button>' +
    (speechSupported ? '<button type="button" class="pill opt" data-speak="' + a.id + '" aria-pressed="' + speaking + '" style="border:2px solid ' + e.fg + ';color:' + e.fg + '"><span aria-hidden="true">' + (speaking ? '⏸' : '🔊') + '</span><span>' + (speaking ? 'Pause' : 'Écouter') + '</span></button>' : '') +
    '</div>' +
    '<div id="endmark" style="padding-top:10px;display:flex;flex-direction:column;gap:4px;color:' + e.fg + '"><span style="font-family:' + e.font + ';font-size:32px;line-height:1.05;font-weight:' + e.dw + '">À suivre</span>' +
    '<span style="font:16px/1.5 var(--serif)">' + (next.length ? 'Deux indices, ou laisse faire le hasard.' : 'Vous avez parcouru toutes les escales disponibles.') + '</span></div>' +
    '<div style="display:flex;flex-direction:column;gap:16px">' + next.map(function (n, i) { return hookCardHTML(n, 40 + i * 7); }).join('') + (next.length ? surpriseHookCardHTML(view.next.concat([a.id])) : '') +
    (next.length ? '' : '<button type="button" class="pill opt" data-library="1" style="align-self:flex-start;border:2px solid ' + e.fg + ';color:' + e.fg + '">Ouvrir la bibliothèque</button>') + '</div>' +
    '</div>';
  return out;
}

/* ---------- rendu ---------- */
var root = document.getElementById('app');
var observer = null;
function setTheme(band, ring) {
  document.documentElement.style.setProperty('--band', band);
  document.documentElement.style.setProperty('--ring', ring);
}
function render(scrollTop) {
  if (observer) { observer.disconnect(); observer = null; }
  var html;
  if (view.name === 'story' && BY_ID[view.id]) {
    var a = BY_ID[view.id], e = ERAS[a.epoque];
    html = storyHTML(a);
    root.style.background = e.bg;
    setTheme('#fff', e.ring);
    document.title = a.titre + ' · Jadis';
  } else if (view.name === 'library') {
    html = libraryHTML(); root.style.background = ''; setTheme('#15130F', '#FFFFFF'); document.title = 'Bibliothèque · Jadis';
  } else {
    if (view.name !== 'home') { view = { name: 'home', id: null, revealed: false }; }
    html = homeHTML(); root.style.background = ''; setTheme('#15130F', '#FFFFFF'); document.title = 'Jadis';
  }
  root.innerHTML = '<div' + (scrollTop === false ? '' : ' class="enter"') + '>' + html + '</div>';
  if (scrollTop !== false) window.scrollTo(0, 0);
  if (view.name === 'story') {
    var mark = document.getElementById('endmark');
    if ('IntersectionObserver' in window && mark) {
      var id = view.id;
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { markRead(id); observer.disconnect(); } });
      }, { threshold: 0.2 });
      observer.observe(mark);
    }
  }
}
function pushIfHome() { if (view.name === 'home') { try { history.pushState({ jd: 1 }, ''); } catch (e) {} } }
function goHome() {
  stopSpeech();
  if (history.state && history.state.jd) { history.back(); return; }
  view = { name: 'home', id: null }; render();
}
window.addEventListener('popstate', function () {
  if (view.name === 'home') return;
  if (view.name === 'story') markRead(view.id);
  stopSpeech(); view = { name: 'home', id: null }; render();
});
function openStory(id) { stopSpeech(); pushIfHome(); view = { name: 'story', id: id, next: null }; render(); }

/* ---------- transition vers une histoire ---------- */
function formatYear(annee) {
  return annee < 0 ? ('-' + Math.abs(annee)) : String(annee);
}
function transitionHTML(a) {
  var e = ERAS[a.epoque];
  return '<div class="transition-screen" id="transitionScreen" style="background:' + e.bg + '">' +
    '<span class="transition-date" style="color:' + e.fg + ';font-family:' + e.font + ';font-weight:' + e.tw + '">' + esc(formatYear(a.annee)) + '</span>' +
    '<span class="transition-place" style="color:' + e.fg + ';font-family:' + e.font + '">' + esc(a.lieu) + '</span>' +
    '</div>';
}
function chooseHook(id) {
  var a = BY_ID[id];
  if (!a) return;
  if (view.name === 'story') markRead(view.id);
  stopSpeech();
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if (reduced) { openStory(id); return; }
  if (observer) { observer.disconnect(); observer = null; }
  root.innerHTML = transitionHTML(a);
  setTimeout(function () { openStory(id); }, 1500);
}

/* ---------- écran d'ouverture ---------- */
var SPLASH_IN = 120, SPLASH_HOLD = 420, SPLASH_SLIDE = 560;
function splashHTML() {
  return '<div class="splash" id="splash"><div class="splash-inner" id="splashInner"></div></div>';
}
function splashCardHTML(i) {
  var name = ERA_ORDER[i], e = ERAS[name];
  var cardClip = torn(300 + i * 11, 26, 9);
  return '<div id="splashCard' + i + '" style="position:absolute;left:-7px;right:-7px;top:120px;height:176px;transform-origin:top;transform:translateY(0) scaleY(1) rotate(-2deg);background:' + e.bg + ';clip-path:' + cardClip + ';opacity:0;transition:opacity 180ms cubic-bezier(.23,1,.32,1)">' +
    '<div class="splash-card-text" style="padding:30px 24px 0;text-align:center">' +
    '<div style="font-family:' + e.font + ';font-weight:900;font-size:52px;line-height:.95;letter-spacing:-.02em;color:' + e.fg + '">Jadis</div>' +
    '<div style="font-family:' + e.font + ';font-weight:' + e.tw + ';font-size:18px;margin-top:8px;text-transform:' + e.dcase + ';letter-spacing:' + e.dls + ';color:' + e.fg + '">' + esc(name) + '</div>' +
    '</div></div>';
}
function runEraStep(container, i, onDone) {
  container.insertAdjacentHTML('beforeend', splashCardHTML(i));
  var card = document.getElementById('splashCard' + i);
  if (!card) { onDone(); return; }
  requestAnimationFrame(function () { requestAnimationFrame(function () { card.style.opacity = '1'; }); });
  setTimeout(function () {
    var textEl = card.querySelector('.splash-card-text');
    if (textEl) textEl.style.opacity = '0';
    card.style.transition = 'transform ' + SPLASH_SLIDE + 'ms cubic-bezier(.22,1,.36,1), clip-path ' + SPLASH_SLIDE + 'ms cubic-bezier(.4,0,.2,1)';
    var dy = STRATA_TOP[i] - 120;
    var sy = STRATA_BH / 176;
    card.style.transform = 'translateY(' + dy + 'px) scaleY(' + sy + ') rotate(0deg)';
    card.style.clipPath = torn(70 + i * 13, 26, 10);
    setTimeout(onDone, SPLASH_SLIDE);
  }, SPLASH_IN + SPLASH_HOLD);
}
function runSplash() {
  root.innerHTML = splashHTML();
  var reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var splash = document.getElementById('splash');
  var inner = document.getElementById('splashInner');
  var done = false;
  if (reduced) { render(); return; }
  function skip() {
    if (done) return;
    done = true;
    render();
  }
  if (splash) splash.addEventListener('click', skip, { once: true });
  function finalize() {
    if (done) return;
    done = true;
    if (splash) {
      splash.removeEventListener('click', skip);
      splash.style.position = 'static';
      splash.style.inset = 'auto';
      splash.style.cursor = 'default';
    }
    view = { name: 'home', id: null };
    root.style.background = '';
    setTheme('#15130F', '#FFFFFF');
    document.title = 'Jadis';
  }
  function fadeIn(id) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        var el = document.getElementById(id);
        if (el) { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; }
      });
    });
  }
  function showNote() {
    inner.insertAdjacentHTML('beforeend', '<div id="splashNoteWrap" style="opacity:0;transform:translateY(8px);transition:opacity 380ms ease,transform 380ms cubic-bezier(.23,1,.32,1)">' + homeNoteCardHTML() + '</div>');
    fadeIn('splashNoteWrap');
    setTimeout(showBody, 380 + 260);
  }
  function showBody() {
    inner.insertAdjacentHTML('beforeend', '<div id="splashRestWrap" style="padding-top:' + STRATA_TOTAL + 'px;opacity:0;transform:translateY(8px);transition:opacity 320ms ease,transform 320ms cubic-bezier(.23,1,.32,1)">' + homeBodyHTML() + '</div>');
    fadeIn('splashRestWrap');
    setTimeout(finalize, 320 + 260);
  }
  var i = 0;
  function nextEra() {
    if (done) return;
    if (i >= ERA_ORDER.length) {
      if (splash) splash.removeEventListener('click', skip);
      showNote();
      return;
    }
    runEraStep(inner, i, function () { i++; nextEra(); });
  }
  nextEra();
}

root.addEventListener('click', function (ev) {
  var t = ev.target.closest('button');
  if (!t) return;
  if (t.hasAttribute('data-go')) {
    if (view.name === 'story') markRead(view.id);
    openStory(t.getAttribute('data-go'));
  } else if (t.hasAttribute('data-hook')) {
    chooseHook(t.getAttribute('data-hook'));
  } else if (t.hasAttribute('data-hook-surprise')) {
    var excl = t.getAttribute('data-hook-surprise').split(',').filter(Boolean);
    var cur = view.name === 'story' ? view.id : null;
    var s = surprisePick(cur, excl);
    if (s) chooseHook(s.id);
  } else if (t.hasAttribute('data-start-explore')) {
    view.revealed = true; render(false);
  } else if (t.hasAttribute('data-speak')) {
    var sp = BY_ID[t.getAttribute('data-speak')];
    if (sp) toggleSpeech(sp);
  } else if (t.hasAttribute('data-home')) {
    if (view.name === 'story') markRead(view.id);
    goHome();
  } else if (t.hasAttribute('data-library')) {
    stopSpeech(); pushIfHome();
    view = { name: 'library', id: null }; render();
  } else if (t.hasAttribute('data-save')) {
    toggleSaved(t.getAttribute('data-save')); render(false);
  } else if (t.hasAttribute('data-unsave')) {
    toggleSaved(t.getAttribute('data-unsave')); render(false);
  } else if (t.hasAttribute('data-reset')) {
    store.read = []; persist(); render();
  }
});

/* ---------- chargement des données ---------- */
function loadingHTML(failed) {
  return '<div class="loading-fade" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 24px;text-align:center">' +
    '<div style="font-family:var(--logo);font-weight:900;font-size:40px;color:#fff">Jadis</div>' +
    (failed
      ? '<p style="margin:0;font:16px/1.5 var(--serif);color:var(--soft)">Impossible de charger les histoires. Vérifiez votre connexion.</p>' +
        '<button type="button" class="pill opt" data-reload="1" style="border:2px solid #fff;color:#fff">Réessayer</button>'
      : '<p style="margin:0;font:15px/1.5 var(--serif);color:var(--soft)">Chargement des histoires…</p>') +
    '</div>';
}
function startApp() {
  root.innerHTML = loadingHTML(false);
  fetch('data/articles.json')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      if (!Array.isArray(data) || !data.length) throw new Error('empty dataset');
      ARTICLES = data;
      indexArticles();
      runSplash();
    })
    .catch(function (err) {
      root.innerHTML = loadingHTML(true);
    });
}
root.addEventListener('click', function (ev) {
  var t = ev.target.closest('button');
  if (t && t.hasAttribute('data-reload')) { startApp(); }
});
var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
startApp();
})();

</script>
